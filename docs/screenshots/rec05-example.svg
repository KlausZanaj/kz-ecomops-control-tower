<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Esempio REC-05: spedizione senza tracking</title>
  <desc id="desc">Anteprima illustrativa dell'app con una spedizione priva di numero di tracciamento e l'azione consigliata.</desc>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a2945"/><stop offset="1" stop-color="#0f6176"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#06223a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1440" height="820" rx="28" fill="#eef3f7"/>
  <rect width="1440" height="116" rx="28" fill="url(#top)"/>
  <rect y="88" width="1440" height="28" fill="url(#top)"/>
  <text x="70" y="61" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="700">KZ EcomOps Control Tower</text>
  <text x="70" y="92" fill="#b9dce5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Reconciliation workspace · synthetic demonstration</text>

  <g filter="url(#shadow)">
    <rect x="64" y="154" width="1312" height="106" rx="18" fill="#ffffff"/>
  </g>
  <text x="92" y="190" fill="#5b7384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">RISULTATO OPERATIVO</text>
  <text x="92" y="231" fill="#0b2d46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">1 anomalia individuata</text>
  <rect x="1080" y="181" width="252" height="50" rx="12" fill="#fff0e8"/>
  <text x="1206" y="213" text-anchor="middle" fill="#9a421d" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Gravità: MEDIA</text>

  <g filter="url(#shadow)">
    <rect x="64" y="292" width="820" height="458" rx="20" fill="#ffffff"/>
    <rect x="916" y="292" width="460" height="458" rx="20" fill="#ffffff"/>
  </g>
  <text x="94" y="340" fill="#0b2d46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Dettaglio dell’anomalia</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="94" y="388" fill="#718594" font-size="14">REGOLA</text>
    <text x="94" y="418" fill="#0b2d46" font-size="20" font-weight="700">REC-05 · SHIPMENT_WITHOUT_TRACKING</text>
    <line x1="94" y1="444" x2="850" y2="444" stroke="#dce6ec"/>

    <text x="94" y="482" fill="#718594" font-size="14">ORDINE</text>
    <text x="94" y="512" fill="#173f57" font-size="19">shopify:REC-05-0001</text>
    <text x="470" y="482" fill="#718594" font-size="14">SPEDIZIONE</text>
    <text x="470" y="512" fill="#173f57" font-size="19">ship-REC-05-0001</text>

    <text x="94" y="560" fill="#718594" font-size="14">STATO</text>
    <text x="94" y="590" fill="#173f57" font-size="19">shipped</text>
    <text x="470" y="560" fill="#718594" font-size="14">TRACKING NUMBER</text>
    <rect x="470" y="570" width="112" height="32" rx="7" fill="#ffe4da"/>
    <text x="526" y="592" text-anchor="middle" fill="#9a421d" font-size="17" font-weight="700">VUOTO</text>

    <line x1="94" y1="629" x2="850" y2="629" stroke="#dce6ec"/>
    <text x="94" y="670" fill="#0b2d46" font-size="18" font-weight="700">Che cosa significa</text>
    <text x="94" y="702" fill="#526d7d" font-size="17">La merce risulta spedita, ma manca il codice necessario</text>
    <text x="94" y="729" fill="#526d7d" font-size="17">per seguire la consegna.</text>
  </g>

  <text x="946" y="340" fill="#0b2d46" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">Azione consigliata</text>
  <rect x="946" y="374" width="400" height="146" rx="16" fill="#eef8f0"/>
  <circle cx="982" cy="412" r="18" fill="#2e8b57"/>
  <path d="M973 412l6 6 12-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1012" y="409" fill="#245d37" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">Recuperare il tracking</text>
  <text x="972" y="450" fill="#557362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Contattare il corriere e aggiornare</text>
  <text x="972" y="476" fill="#557362" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">il canale di vendita con il codice.</text>

  <text x="946" y="570" fill="#718594" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">STATO DI REVISIONE</text>
  <rect x="946" y="590" width="182" height="46" rx="11" fill="#edf3ff"/>
  <text x="1037" y="619" text-anchor="middle" fill="#294f89" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">OPEN</text>
  <rect x="946" y="660" width="242" height="52" rx="12" fill="#167e98"/>
  <text x="1067" y="693" text-anchor="middle" fill="#ffffff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">Esporta anomalia CSV</text>

  <text x="720" y="792" text-anchor="middle" fill="#718594" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Visualizzazione illustrativa basata sul caso sintetico permanente REC-05 del repository</text>
</svg>
